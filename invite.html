<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Team - Khel Yogdaan</title>
    <style>
        /* Base Reset & Gaming Background */
        body {
            background: linear-gradient(135deg, #0d0d0d, #1a0500); 
            color: #FFFFFF; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }

        /* Glassmorphism Card Effect */
        .container {
            background: rgba(30, 30, 30, 0.9); 
            backdrop-filter: blur(10px);
            padding: 40px 30px; 
            border-radius: 20px; 
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8), 0 0 20px rgba(255, 87, 34, 0.3); 
            width: 85%; 
            max-width: 420px; 
            border: 2px solid rgba(255, 87, 34, 0.5);
            animation: slideUp 0.8s ease-out;
        }

        /* Title */
        h2 { 
            color: #FF5722; 
            margin: 0 0 15px 0; 
            font-size: 28px; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            text-shadow: 0px 4px 10px rgba(255, 87, 34, 0.6);
        }

        p { margin: 10px 0; }

        .status-text {
            font-size: 18px; 
            font-weight: bold; 
            color: #4CAF50; /* Green by default for success/loading */
        }

        .subtitle {
            color: #AAAAAA; 
            font-size: 13px; 
            line-height: 1.5;
        }

        /* Cool Spinner */
        .loader-container { margin-top: 25px; height: 50px; }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1); 
            border-top: 4px solid #FF5722; 
            border-radius: 50%;
            width: 40px; 
            height: 40px; 
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            margin: 0 auto;
        }

        /* Premium Download Button */
        .btn {
            display: inline-block; 
            padding: 16px 35px; 
            margin-top: 25px; 
            background: linear-gradient(90deg, #FF5722, #D84315);
            color: #FFFFFF; 
            text-decoration: none; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 30px;
            text-transform: uppercase;
            box-shadow: 0 8px 20px rgba(255, 87, 34, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: pulse 2s infinite;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(255, 87, 34, 0.3);
        }

        /* Hidden elements class */
        .hidden { display: none !important; }

        /* Keyframe Animations */
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 87, 34, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 87, 34, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 87, 34, 0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎮 KHEL YOGDAAN</h2>
        <p class="status-text" id="statusText">Opening Match Arena...</p>
        <p class="subtitle" id="subText">Hold tight! If you have the app installed, you are being redirected to your team's slot.</p>
        
        <div class="loader-container" id="loaderBox">
            <div class="loader"></div>
        </div>

        <!-- Hidden Download Button -->
        <a href="https://purgatory.42web.io/pstore.html?app=KhelYogdaan%20-%20Free%20Fire%20Tournament%20Platfrom" class="btn hidden" id="downloadBtn">DOWNLOAD APP NOW</a>
    </div>

    <script>
        window.onload = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var matchId = urlParams.get('matchId');
            var slot = urlParams.get('slot');
            var code = urlParams.get('code'); // 🔥 Secret Code Fetching
            
            // App Download Link
            var fallbackUrl = "https://purgatory.42web.io/pstore.html?app=KhelYogdaan - Free Fire Tournament Platfrom";
            
            if(matchId && slot) {
                // Encode fallback URL so it passes correctly through Intent
                var encodedFallback = encodeURIComponent(fallbackUrl);
                
                // Construct the Intent URI
                var intentParams = "?matchId=" + matchId + "&slot=" + slot;
                if(code) {
                    intentParams += "&code=" + code;
                }

                var appIntent = "intent://r-coder08.github.io/KhelYogdaan/invite.html" + intentParams + "#Intent;scheme=https;package=com.khelyogdaan.khelyogdaan;S.browser_fallback_url=" + encodedFallback + ";end";
                
                // Try launching the App
                window.location.href = appIntent;
                
                // If the app is NOT installed, the browser fallback will automatically redirect. 
                // BUT just in case some browsers block intent fallbacks, we show the manual button after 3 seconds.
                setTimeout(function() {
                    document.getElementById('statusText').innerText = "App Not Found!";
                    document.getElementById('statusText').style.color = "#FFEB3B"; // Yellow warning
                    document.getElementById('subText').innerText = "Looks like you don't have Khel Yogdaan installed. Download it now to join the match.";
                    
                    document.getElementById('loaderBox').classList.add("hidden");
                    document.getElementById('downloadBtn').classList.remove("hidden");
                }, 3000);

            } else {
                // Link is broken / missing parameters
                document.getElementById('statusText').innerText = "Invalid Invite Link!";
                document.getElementById('statusText').style.color = "#F44336"; // Red Error
                document.getElementById('subText').innerText = "The link you clicked is broken or missing match details.";
                
                document.getElementById('loaderBox').classList.add("hidden");
                document.getElementById('downloadBtn').classList.remove("hidden");
            }
        };
    </script>
</body>
</html>
